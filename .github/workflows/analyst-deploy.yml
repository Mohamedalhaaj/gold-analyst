# analyst-deploy (prereg §7; register R-AN-75): builds the /analyst/ page from main's records and deploys the
# separate Worker `gold-analyst` with wrangler. Only this workflow uses the environment `analyst-pages`, whose
# deployment branches are main only; CLOUDFLARE_API_TOKEN is an environment secret referenced by name, and the
# account id is the environment variable CLOUDFLARE_ACCOUNT_ID. It never runs on a claude/* ref.
name: analyst-deploy

on:
  workflow_run:
    workflows: [analyst-merge, analyst-settle]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: analyst-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: analyst-pages
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build the page
        run: python -I analyst/jobs/build_page.py

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy --config deploy/wrangler.jsonc
